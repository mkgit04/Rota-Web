<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Rota – Cairo Metro journey planner</title>
    <meta name="description"
        content="Rota helps you explore Cairo Metro lines, plan journeys, calculate fares and follow your trip.">
    <meta property="og:title" content="Rota – Cairo Metro companion">
    <meta property="og:type" content="website">
    <style>
        :root {
            --bg: #fff;
            --bg2: #f3f5f5;
            --fg: #13201d;
            --mut: #4d5f5a;
            --card: #fff;
            --bd: #dde4e2;
            --p: #14B8A4;
            --pd: #0F6B57;
            --lk: #0F6B57;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0B0F0E;
                --bg2: #121817;
                --fg: #e8f0ee;
                --mut: #9db0ab;
                --card: #141b1a;
                --bd: #25312f;
                --lk: #3fd6c3;
                color-scheme: dark
            }
        }

        :root[data-theme=dark] {
            --bg: #0B0F0E;
            --bg2: #121817;
            --fg: #e8f0ee;
            --mut: #9db0ab;
            --card: #141b1a;
            --bd: #25312f;
            --lk: #3fd6c3;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.65 system-ui, "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif
        }

        [dir=rtl] body {
            font-family: "Noto Naskh Arabic", Tahoma, "Segoe UI", system-ui, sans-serif;
            line-height: 1.9
        }

        a {
            color: var(--lk)
        }

        :focus-visible {
            outline: 3px solid var(--p);
            outline-offset: 2px
        }

        .w {
            max-width: 1080px;
            margin: auto;
            padding: 0 20px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--bd);
            padding-top: env(safe-area-inset-top, 0px)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 60px
        }

        .logo {
            font-weight: 800;
            font-size: 22px;
            text-decoration: none;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 8px
        }

        .logo i {
            display: inline-flex;
            align-items: center
        }

        .logo i b {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 3px solid var(--p);
            background: var(--bg)
        }

        .logo i s {
            width: 14px;
            height: 4px;
            background: var(--p)
        }

        nav {
            display: flex;
            gap: 2px;
            margin-inline-start: auto;
            flex-wrap: wrap
        }

        nav a {
            padding: 6px 10px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--mut);
            font-size: 14px
        }

        nav a:hover {
            background: var(--bg2)
        }

        nav a[aria-current=page] {
            color: var(--pd);
            background: color-mix(in srgb, var(--p) 18%, transparent);
            font-weight: 600
        }

        :root[data-theme=dark] nav a[aria-current=page] {
            color: var(--lk)
        }

        .ctl {
            display: flex;
            gap: 6px
        }

        button,
        select,
        input,
        textarea {
            font: inherit;
            color: inherit
        }

        .ib,
        select {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 6px 10px;
            cursor: pointer;
            min-height: 38px
        }

        #mb {
            display: none
        }

        @media(max-width:1000px) {
            #mb {
                display: block
            }

            nav {
                display: none;
                position: absolute;
                inset-inline: 0;
                top: 100%;
                background: var(--bg);
                flex-direction: column;
                padding: 10px 20px;
                border-bottom: 1px solid var(--bd)
            }

            nav.o {
                display: flex
            }
        }

        section {
            padding: 48px 0
        }

        h1 {
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.2;
            margin: 0 0 14px
        }

        h2 {
            font-size: 28px;
            margin: 0 0 14px
        }

        h3 {
            margin: 0 0 6px;
            font-size: 18px
        }

        .mut {
            color: var(--mut)
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 32px;
            align-items: center
        }

        @media(max-width:800px) {
            .hero {
                grid-template-columns: 1fr
            }
        }

        .btn {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 12px;
            background: var(--p);
            color: #04201b;
            font-weight: 700;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            margin: 4px 6px 4px 0;
            margin-inline-end: 8px
        }

        .btn.s {
            background: transparent;
            border: 1.5px solid var(--p);
            color: var(--fg)
        }

        .btn[aria-disabled=true] {
            opacity: .55;
            cursor: not-allowed;
            background: var(--bg2);
            color: var(--mut)
        }

        .g {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
            gap: 16px
        }

        html,
        body {
            overflow-x: hidden
        }

        img,
        svg {
            max-width: 100%
        }

        .hero>* {
            min-width: 0
        }

        .hs {
            position: relative;
            overflow: hidden
        }

        .hs .w {
            position: relative;
            z-index: 1
        }

        .bl {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .25;
            background: var(--p);
            top: -120px;
            inset-inline-end: -100px;
            pointer-events: none
        }

        .bl.b2 {
            background: var(--pd);
            top: auto;
            bottom: -160px;
            inset-inline-end: auto;
            inset-inline-start: -120px
        }

        .hs h1 {
            background: linear-gradient(100deg, var(--fg) 35%, var(--lk));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        header.sc {
            box-shadow: 0 4px 18px rgba(0, 0, 0, .1)
        }

        .rt {
            position: relative
        }

        .rt s {
            transform-origin: left
        }

        [dir=rtl] .rt s {
            transform-origin: right
        }

        .btn[aria-disabled=true]:hover {
            transform: none;
            box-shadow: none
        }

        @media(min-width:1400px) {
            .w {
                max-width: 1200px
            }
        }

        @media(max-width:600px) {
            section {
                padding: 32px 0
            }

            .w {
                padding: 0 16px
            }

            h2 {
                font-size: 23px
            }

            .btn {
                display: block;
                text-align: center;
                margin: 8px 0;
                padding: 14px
            }

            .hero {
                gap: 24px
            }

            .logo {
                font-size: 20px
            }

            .bar {
                gap: 8px
            }

            .ib,
            select {
                min-height: 44px;
                min-width: 44px
            }

            .bl {
                width: 260px;
                height: 260px
            }
        }

        .c {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06)
        }

        .tag {
            display: inline-block;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 99px;
            background: color-mix(in srgb, var(--p) 20%, transparent);
            color: var(--pd);
            font-weight: 600
        }

        :root[data-theme=dark] .tag {
            color: var(--lk)
        }

        .ph {
            width: 250px;
            max-width: 100%;
            margin: auto;
            border: 8px solid #1c2624;
            border-radius: 34px;
            background: var(--card);
            padding: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .18)
        }

        .rt {
            display: flex;
            align-items: center;
            margin: 14px 0
        }

        .rt b {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid var(--p);
            background: var(--card);
            flex: none
        }

        .rt s {
            flex: 1;
            height: 4px;
            background: var(--p)
        }

        .rt b.f {
            background: var(--p)
        }

        .pr {
            height: 8px;
            border-radius: 9px;
            background: var(--bg2);
            overflow: hidden
        }

        .pr i {
            display: block;
            width: 45%;
            height: 100%;
            background: var(--p)
        }

        .bg2 {
            background: var(--bg2)
        }

        details {
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 8px 0;
            background: var(--card)
        }

        summary {
            cursor: pointer;
            font-weight: 600
        }

        input,
        textarea,
        select.f {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 10px;
            margin: 4px 0 12px
        }

        .er {
            color: #c0392b;
            font-size: 14px;
            min-height: 0
        }

        :root[data-theme=dark] .er {
            color: #ff8a7a
        }

        .note {
            border-inline-start: 4px solid var(--p);
            padding: 10px 14px;
            background: var(--bg2);
            border-radius: 8px;
            margin: 16px 0
        }

        footer {
            border-top: 1px solid var(--bd);
            padding: 36px 0;
            background: var(--bg2);
            font-size: 14px
        }

        footer .g {
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
        }

        footer a {
            display: block;
            margin: 4px 0
        }

        .toc a {
            display: block
        }

        @media(prefers-reduced-motion:no-preference) {
            @keyframes pg {
                from {
                    opacity: 0;
                    transform: translateY(16px)
                }
            }

            @keyframes fl {
                to {
                    transform: translate(40px, 30px) scale(1.12)
                }
            }

            @keyframes fy {
                50% {
                    transform: translateY(-12px)
                }
            }

            @keyframes gr {
                from {
                    width: 0
                }
            }

            @keyframes sx {
                from {
                    transform: scaleX(0)
                }
            }

            @keyframes pu {
                0% {
                    box-shadow: 0 0 0 0 color-mix(in srgb, var(--p) 55%, transparent)
                }

                100% {
                    box-shadow: 0 0 0 12px transparent
                }
            }

            @keyframes tr {
                to {
                    inset-inline-start: calc(100% - 10px)
                }
            }

            main>section {
                animation: pg .5s ease both
            }

            nav.o {
                animation: pg .25s ease both
            }

            .bl {
                animation: fl 12s ease-in-out infinite alternate
            }

            .bl.b2 {
                animation-delay: -6s
            }

            .hs .hero>div:first-child>* {
                animation: pg .7s ease both
            }

            .hs .hero>div:first-child>:nth-child(2) {
                animation-delay: .1s
            }

            .hs .hero>div:first-child>:nth-child(3) {
                animation-delay: .2s
            }

            .hs .hero>div:first-child>:nth-child(4) {
                animation-delay: .3s
            }

            .hs .hero>div:first-child>:nth-child(5) {
                animation-delay: .4s
            }

            .ph {
                animation: fy 6s ease-in-out infinite
            }

            .pr i {
                animation: gr 2.4s ease-out both .4s
            }

            .rt s {
                animation: sx 1.2s ease both .3s
            }

            .rt b.f {
                animation: pu 2s infinite
            }

            .rt::after {
                content: '';
                position: absolute;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 0 0 3px var(--pd);
                top: 50%;
                margin-top: -5px;
                inset-inline-start: 0;
                animation: tr 4s ease-in-out infinite alternate
            }

            .btn {
                transition: transform .2s, box-shadow .2s
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 18px rgba(20, 184, 164, .35)
            }

            nav a {
                transition: background .2s, color .2s
            }

            .ib {
                transition: transform .2s, background .2s
            }

            .ib:hover {
                transform: scale(1.08)
            }

            details {
                transition: border-color .2s
            }

            details[open] {
                border-color: var(--p)
            }

            .c {
                transition: transform .25s, box-shadow .25s, border-color .25s
            }

            .c:hover {
                transform: translateY(-4px);
                box-shadow: 0 14px 30px rgba(20, 184, 164, .18);
                border-color: var(--p)
            }

            .rv {
                opacity: 0;
                transform: translateY(24px);
                transition: opacity .6s ease var(--d, 0ms), transform .6s ease var(--d, 0ms)
            }

            .rv.in {
                opacity: 1;
                transform: none;
                transition: transform .25s, box-shadow .25s, border-color .25s, opacity .25s
            }
        }

        [dir=rtl] .arr {
            transform: scaleX(-1);
            display: inline-block
        }
    </style>
</head>

<body>
    <a class="btn" href="#main" style="position:absolute;left:-999px" onfocus="this.style.left='8px'"
        onblur="this.style.left='-999px'">Skip</a>
    <header>
        <div class="w bar"><a class="logo" href="#home"><i><b></b><s></s><b></b></i>Rota</a>
            <nav id="nav" aria-label="Main"></nav>
            <div class="ctl"><button class="ib" id="th" aria-label="Theme">◐</button><button class="ib" id="lg"
                    aria-label="Language">عربي</button><button class="ib" id="mb" aria-label="Menu"
                    aria-expanded="false">☰</button></div>
        </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
        <div class="w" id="ft"></div>
    </footer>
    <script>
        const C = {
            operator: "", supportEmail: "", feedbackUrl: "", stores: { android: "", ios: "" },
            tickets: [0, 1, 2].map(() => ({ name: "", price: "", range: "", elig: "", cond: "", verified: "", desc: "" }))
        };
        let lang = "en"; try { lang = localStorage.getItem("rota-lang") || "en" } catch (e) { }
        const t = (e, a) => lang === "ar" ? a : e;
        const NAV = [["home", "Home", "الرئيسية"], ["features", "Features", "المزايا"], ["tickets", "Tickets", "التذاكر"], ["how-it-works", "How it works", "كيف يعمل"], ["faq", "FAQ", "الأسئلة"], ["support", "Support", "الدعم"], ["about", "About", "عن روتا"], ["download", "Download", "التحميل"]];
        const NC = t => `<span class=mut>${t}</span>`;
        const nc = () => NC(t("Not configured yet", "لم يتم الإعداد بعد"));
        const FEAT = [["Browse lines & stations", "تصفح الخطوط والمحطات"], ["Search stations by name", "البحث عن المحطات بالاسم"], ["Plan origin → destination", "تخطيط الرحلة من البداية للوجهة"], ["Automatic fare calculation", "حساب الأجرة تلقائيًا"], ["Full route and transfer stations", "المسار الكامل ومحطات التبديل"], ["Estimated journey duration", "المدة التقديرية للرحلة"], ["Find the nearest station", "أقرب محطة إليك"], ["Navigate to a station", "التنقل إلى محطة"], ["Start and stop a live trip", "بدء وإنهاء رحلة مباشرة"], ["Current station, next station, progress", "المحطة الحالية والتالية والتقدم"], ["Ongoing trip notification", "إشعار مستمر أثناء الرحلة"], ["Arabic/English and light/dark", "عربي/إنجليزي ووضع فاتح/داكن"]];
        const GPS = ["GPS can be weak or unavailable underground, so station detection may be interrupted. Background tracking depends on permissions, battery settings and system limits, and is not guaranteed after the operating system closes the app.", "قد تضعف إشارة GPS أو تنقطع تحت الأرض، لذلك قد يتوقف اكتشاف المحطات. يعتمد التتبع في الخلفية على الأذونات وإعدادات البطارية وقيود النظام، ولا يُضمن بعد إغلاق النظام للتطبيق."];
        const FAQ = [
            ["What is Rota?", "Rota is a mobile app to explore Cairo Metro stations, plan journeys, calculate fares, find nearby stations and follow active trips.", "ما هو روتا؟", "روتا تطبيق للجوال لاستكشاف محطات مترو القاهرة وتخطيط الرحلات وحساب الأجرة وإيجاد أقرب محطة ومتابعة الرحلة."],
            ["Can I calculate metro fares?", "Yes, for supported journeys using the fare rules in the app. Verify the fare before travelling, as official prices can change.", "هل يمكنني حساب أجرة المترو؟", "نعم للرحلات المدعومة وفق قواعد الأجرة في التطبيق. تحقق من الأجرة قبل السفر لأن الأسعار الرسمية قد تتغير."],
            ["Can I find the nearest station?", "Yes, if you allow location access.", "هل أستطيع إيجاد أقرب محطة؟", "نعم، بشرط السماح بالوصول إلى الموقع."],
            ["Does Rota track my trip live?", "Yes: current and next station and progress. Accuracy depends on location data and device conditions.", "هل يتتبع روتا رحلتي مباشرة؟", "نعم: المحطة الحالية والتالية والتقدم. تعتمد الدقة على بيانات الموقع وظروف الجهاز."],
            ["Does live tracking work underground?", "GPS may be weak or unavailable underground. Rota partly handles GPS loss, but uninterrupted tracking cannot be guaranteed.", "هل يعمل التتبع تحت الأرض؟", "قد تضعف إشارة GPS أو تنقطع. يتعامل روتا جزئيًا مع فقدان الإشارة لكن لا يمكن ضمان تتبع مستمر."],
            ["Does tracking continue in the background?", "During an active trip, when permissions and system conditions allow. Battery settings or restrictions may interrupt it.", "هل يستمر التتبع في الخلفية؟", "أثناء الرحلة النشطة عندما تسمح الأذونات وظروف النظام. قد تقطعه إعدادات البطارية أو القيود."],
            ["Does tracking continue after I force-close the app?", "No promise is made. Reliable continuation after the system terminates the app is not implemented.", "هل يستمر التتبع بعد إغلاق التطبيق قسرًا؟", "لا نَعِد بذلك. الاستمرار الموثوق بعد إنهاء النظام للتطبيق غير مُنفّذ."],
            ["Does Rota sell metro tickets?", "No. Rota provides journey and fare information, not a digital ticket or payment service.", "هل يبيع روتا تذاكر المترو؟", "لا. يقدم روتا معلومات الرحلة والأجرة وليس تذكرة رقمية أو خدمة دفع."],
            ["Does Rota require an account?", "The current app is designed without traditional account registration. This will be confirmed for the final release.", "هل يتطلب روتا حسابًا؟", "صُمم التطبيق الحالي دون تسجيل حساب تقليدي، وسيتم تأكيد ذلك في الإصدار النهائي."],
            ["Does Rota work in Arabic?", "Yes, Arabic and English are supported.", "هل يعمل روتا بالعربية؟", "نعم، العربية والإنجليزية مدعومتان."],
            ["Can I change the app theme?", "Yes, light and dark themes.", "هل يمكن تغيير المظهر؟", "نعم، مظهر فاتح وداكن."],
            ["How can I submit feedback?", "Through the app’s feedback form (Google Forms). The link will appear here once configured.", "كيف أرسل ملاحظاتي؟", "عبر نموذج الملاحظات في التطبيق (Google Forms). سيظهر الرابط هنا عند إعداده."],
            ["Does Rota provide live service alerts?", "No. Live service announcements are not implemented.", "هل يوفر روتا تنبيهات الخدمة المباشرة؟", "لا. إعلانات الخدمة المباشرة غير مُنفّذة."],
            ["Is Rota affiliated with Cairo Metro?", "No. Rota is an independent app, not operated or endorsed by the metro operator or the National Authority for Tunnels.", "هل روتا تابع لمترو القاهرة؟", "لا. روتا تطبيق مستقل ولا تشغّله أو تعتمده جهة تشغيل المترو أو الهيئة القومية للأنفاق."]];

            document.getElementById("ft").innerHTML = `<div class=g><div><div class=logo>Rota</div><p class=mut>${t("Independent Cairo Metro navigation and trip companion.", "رفيق مستقل للتنقل ورحلات مترو القاهرة.")}</p></div><div>${["features", "tickets", "how-it-works", "faq"].map(k => `<a href="#${k}">${t(...META[k].map(s => s.split(" –")[0].split(" –")[0]))}</a>`).join("")}</div><div>${["support", "contact", "about", "download"].map(k => `<a href="#${k}">${t(...META[k].map(s => s.split(" –")[0]))}</a>`).join("")}<a href="#privacy-policy">${t("Privacy policy", "سياسة الخصوصية")}</a><a href="#terms">${t("Terms of service", "شروط الخدمة")}</a></div><div><strong>${t("Contact", "تواصل")}</strong><br>${C.supportEmail || nc()}</div></div><p class=mut style="margin-top:20px">© ${new Date().getFullYear()} ${C.operator || "Rota"}. ${t("Rota is an independent app, not affiliated with Cairo Metro or the National Authority for Tunnels.", "روتا تطبيق مستقل غير تابع لمترو القاهرة أو الهيئة القومية للأنفاق.")}</p>`;
            document.getElementById("nav").classList.remove("o");
            if ("IntersectionObserver" in window) { const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target) } }), { threshold: .1 }); document.querySelectorAll("main .c,main h2,main .note,main details").forEach((el, i) => { el.classList.add("rv"); el.style.setProperty("--d", (i % 4) * 70 + "ms"); io.observe(el) }) }
            const q = document.getElementById("q"); if (q) q.oninput = () => { const v = q.value.trim().toLowerCase(); let n = 0; document.querySelectorAll("#fl details").forEach(d => { const h = !d.textContent.toLowerCase().includes(v); d.hidden = h; if (!h) n++ }); document.getElementById("nr").hidden = n > 0 };
            const f = document.getElementById("sf"); if (f) f.onsubmit = e => {
                e.preventDefault(); const em = document.getElementById("e").value, m = document.getElementById("m").value.trim();
                document.getElementById("ee").textContent = /^\S+@\S+\.\S+$/.test(em) ? "" : t("Enter a valid email address.", "أدخل بريدًا إلكترونيًا صحيحًا.");
                document.getElementById("me").textContent = m ? "" : t("Please write a message.", "يرجى كتابة رسالة.");
                if (/^\S+@\S+\.\S+$/.test(em) && m) document.getElementById("st").textContent = C.supportEmail ? "" : t("Submission is not configured yet. Your message was not sent.", "الإرسال غير مُعدّ بعد. لم تُرسل رسالتك.")
            };
            document.querySelectorAll(".toc a").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.s).scrollIntoView() })
        }
        document.getElementById("lg").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("rota-lang", lang) } catch (e) { } render() };
        document.getElementById("th").onclick = () => { const r = document.documentElement, d = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches); r.dataset.theme = d ? "light" : "dark"; try { localStorage.setItem("rota-theme", r.dataset.theme) } catch (e) { } };
        document.getElementById("mb").onclick = function () { const o = document.getElementById("nav").classList.toggle("o"); this.setAttribute("aria-expanded", o) };
        try { const s = localStorage.getItem("rota-theme"); if (s) document.documentElement.dataset.theme = s } catch (e) { }
        addEventListener("hashchange", () => { render(); scrollTo(0, 0) }); addEventListener("scroll", () => document.querySelector("header").classList.toggle("sc", scrollY > 8), { passive: true }); render();
    </script>
